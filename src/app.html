<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#7b2a22" />
		<link rel="icon" href="/plumbob.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			// Before first paint: apply the saved theme, and mark returning visitors
			// so the first-visit welcome does not flash while the app loads.
			try {
				var t = localStorage.getItem('gradesim:theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
				if (localStorage.getItem('gradesim:v1')) document.documentElement.setAttribute('data-has-data', '');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
